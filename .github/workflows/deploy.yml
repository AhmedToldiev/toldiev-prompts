# Каждый пуш в main: собрать сайт → выкатить этот коммит на Timeweb → убедиться, что новая версия открывается.
# Нужен секрет репозитория TIMEWEB_TOKEN (API-токен Timeweb Cloud).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-timeweb
  cancel-in-progress: true

env:
  TIMEWEB_APP_ID: "265019"
  SITE_URL: https://toldiev-prompts.ru

jobs:
  deploy:
    runs-on: ubuntu-latest
    # сборка на стороне Timeweb идёт ~20 минут
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build
        run: node build.mjs

      - name: Check build output
        run: |
          set -e
          for page in index.html universal books study images photo retro texts business productivity data languages libraries; do
            f="dist/$page"; [ "$page" = index.html ] || f="dist/$page/index.html"
            test -s "$f" || { echo "::error::Нет страницы $f"; exit 1; }
          done
          VERSION=$(grep -o 'style.css?v=[a-f0-9]*' dist/index.html | head -1)
          test -n "$VERSION" || { echo "::error::Не найдена версия стилей"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Сборка ок, $VERSION"

      - name: Check Timeweb token
        id: token
        env:
          TIMEWEB_TOKEN: ${{ secrets.TIMEWEB_TOKEN }}
        run: |
          if [ -n "$TIMEWEB_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Секрет TIMEWEB_TOKEN не задан — только проверка сборки, деплой на Timeweb пропущен"
          fi

      - name: Deploy to Timeweb
        if: steps.token.outputs.present == 'true'
        env:
          TIMEWEB_TOKEN: ${{ secrets.TIMEWEB_TOKEN }}
        run: |
          set -e
          code=$(curl -s -o response.json -w '%{http_code}' -X POST \
            "https://api.timeweb.cloud/api/v1/apps/$TIMEWEB_APP_ID/deploy" \
            -H "Authorization: Bearer $TIMEWEB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"commit_sha\": \"$GITHUB_SHA\"}")
          echo "Timeweb ответил $code"
          cat response.json; echo
          case "$code" in 2*) ;; *) echo "::error::Timeweb не принял деплой ($code)"; exit 1 ;; esac
          DEPLOY_ID=$(jq -r '.deploy.id' response.json)
          test -n "$DEPLOY_ID" && test "$DEPLOY_ID" != null || { echo "::error::В ответе нет id деплоя"; exit 1; }
          echo "DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_ENV"

      - name: Wait for Timeweb build
        if: steps.token.outputs.present == 'true'
        env:
          TIMEWEB_TOKEN: ${{ secrets.TIMEWEB_TOKEN }}
        run: |
          last=""
          for i in $(seq 1 80); do
            curl -s "https://api.timeweb.cloud/api/v1/apps/$TIMEWEB_APP_ID/deploys" \
              -H "Authorization: Bearer $TIMEWEB_TOKEN" > deploys.json || true
            status=$(jq -r --arg id "$DEPLOY_ID" '[.. | objects | select(.id? == $id)][0].status // empty' deploys.json)
            ended=$(jq -r --arg id "$DEPLOY_ID" '[.. | objects | select(.id? == $id)][0].ended_at // empty' deploys.json)
            [ "$status" != "$last" ] && echo "$(date -u +%H:%M:%S) статус деплоя: ${status:-неизвестен}" && last="$status"
            if [ -n "$ended" ]; then
              case "$status" in
                *fail*|*error*|*cancel*|*stop*) echo "::error::Timeweb: деплой завершился со статусом $status"; exit 1 ;;
                *) echo "Timeweb закончил деплой: $status"; exit 0 ;;
              esac
            fi
            sleep 30
          done
          echo "::error::Timeweb не закончил деплой за 40 минут"; exit 1

      - name: Wait for new version on site
        if: steps.token.outputs.present == 'true'
        run: |
          for i in $(seq 1 20); do
            if curl -s -m 15 "$SITE_URL/?ci=$GITHUB_RUN_ID-$i" | grep -q "$VERSION"; then
              echo "Новая версия на сайте ($VERSION)"; exit 0
            fi
            sleep 15
          done
          echo "::error::Деплой завершён, но на $SITE_URL нет новой версии ($VERSION)"; exit 1
